# Publishes approved posts whose moment has come. Hourly, because posts are planned to the hour.
name: Publish due posts

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --no-dev
      - run: uv run agentic-marketing publish
        env:
          AGENTIC_MARKETING_SUPABASE_URL: ${{ secrets.AGENTIC_MARKETING_SUPABASE_URL }}
          AGENTIC_MARKETING_SUPABASE_SERVICE_KEY: ${{ secrets.AGENTIC_MARKETING_SUPABASE_SERVICE_KEY }}
          AGENTIC_MARKETING_SUPABASE_ANON_KEY: ${{ secrets.AGENTIC_MARKETING_SUPABASE_ANON_KEY }}
          AGENTIC_MARKETING_GITHUB_TOKEN: ${{ secrets.AGENTIC_MARKETING_GITHUB_TOKEN }}
